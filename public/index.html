<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Vault — File Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%237c5cff'/><path d='M18 22h12l4 4h12v18H18z' fill='white' opacity='.95'/></svg>" />
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>
  <div class="bg-orb orb-c"></div>

  <header class="app-header">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        </svg>
      </div>
      <div>
        <h1>Vault</h1>
        <p class="tagline">A premium file manager</p>
      </div>
    </div>
    <div class="stats" id="stats">
      <div class="stat"><span class="stat-value" id="statCount">0</span><span class="stat-label">files</span></div>
      <div class="stat"><span class="stat-value" id="statSize">0 B</span><span class="stat-label">total</span></div>
    </div>
  </header>

  <main class="container">
    <section class="dropzone glass" id="dropzone" aria-label="Upload files">
      <input type="file" id="fileInput" multiple hidden />
      <div class="dropzone-inner">
        <div class="dz-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 16V4"/>
            <path d="m6 10 6-6 6 6"/>
            <path d="M4 20h16"/>
          </svg>
        </div>
        <h2>Drop files here to upload</h2>
        <p>or <button type="button" class="link-btn" id="browseBtn">browse from your device</button></p>
        <p class="hint">Any file type · up to 10 GB each · streams to disk</p>
      </div>
    </section>

    <section class="uploads" id="uploads" hidden>
      <h3>Uploading</h3>
      <div class="upload-list" id="uploadList"></div>
    </section>

    <section class="toolbar">
      <div class="search glass">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="text" id="search" placeholder="Search files by name…" autocomplete="off" />
        <button type="button" class="clear-btn" id="clearSearch" hidden aria-label="Clear search">×</button>
      </div>
      <button type="button" class="ghost-btn" id="refreshBtn" title="Refresh">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
        Refresh
      </button>
    </section>

    <section class="files" id="files"></section>

    <section class="empty glass" id="empty" hidden>
      <div class="empty-illustration" aria-hidden="true">
        <svg viewBox="0 0 120 120" width="120" height="120" fill="none">
          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#7c5cff" stop-opacity=".85"/>
              <stop offset="1" stop-color="#22d3ee" stop-opacity=".85"/>
            </linearGradient>
          </defs>
          <rect x="18" y="30" width="84" height="66" rx="12" fill="url(#g1)" opacity=".15"/>
          <path d="M22 42a8 8 0 0 1 8-8h20l8 8h32a8 8 0 0 1 8 8v40a8 8 0 0 1-8 8H30a8 8 0 0 1-8-8z" stroke="url(#g1)" stroke-width="2.5"/>
          <path d="M46 70h28M46 80h20" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <h3>No files yet</h3>
      <p>Drop something in the box above to get started.</p>
    </section>
  </main>

  <div class="toast-stack" id="toasts" aria-live="polite" aria-atomic="true"></div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card glass" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle">Delete file?</h3>
      <p id="modalBody">This action cannot be undone.</p>
      <div class="modal-actions">
        <button type="button" class="ghost-btn" id="modalCancel">Cancel</button>
        <button type="button" class="danger-btn" id="modalConfirm">Delete</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
